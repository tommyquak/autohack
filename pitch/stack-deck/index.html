    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07090b; }

  <body>
    <!-- Direct-open deck. Serve this folder over http (double-click present.command, or
         `node tools/serve.mjs`), open http://localhost:4173/, press P (or the Present button) for the
         audience tab; this tab becomes the presenter view. -->
    <hyperframes-slideshow tabindex="0" notes-storage-key="triage-stack-v1">
      <hyperframes-player
        interactive
        runtime-src="vendor/hyperframe.runtime.iife.js"
        src="composition/index.html"
      ></hyperframes-player>
      <!-- DUPLICATED ISLAND: generated from notes/script.md by tools/build.py,
           identical to the island in composition/index.html. -->
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "cover",
      "notes": "An analyst reads 2,167 close-approach events. One in four flagged events is noise. Second Look clears it, and by design it can never hide a Critical. Along the way it found where the rulebook itself wastes fuel. This deck walks through how it works, one layer at a time, in plain words.\n\n[about 24 s, from 0:00]\nHook on the slide: \"Every team here will predict collision risk. Second Look is built so it can never hide a Critical.\" No uniqueness claims. Background: our Globe tab (latitude bands; the traffic dots are illustrative, the data has no longitude). 2,167 events (events.json summary.n_events). One in four = 288 of 1,090 flagged events removed by the model, all truly below threshold at their latest CDM. The five chips are the five layers we walk through."
    },
    {
      "sceneId": "problem",
      "notes": "Our user is the conjunction analyst who looks at every flagged warning. Each warning is a CDM. Today's rule flags a CDM when its Pc upper bound or its miss distance crosses a threshold. The upper bound is deliberately loose, so it flags 54.2 percent of our test CDMs, and 4,526 of those are truly below threshold. On the dashboard, that's 1,090 events in the queue.\n\n[about 31 s, from 0:24]\n54.2% = metrics.json max_risk_estimate_rule.flagged_rate 0.5417 of 24,484 CDMs; 4,526 = confusion[0][1]. 1,090 = events.json summary.by_baseline_tier Elevated 894 + Critical 196 (the dashboard's \"FLAGGED FOR REVIEW · rule alone\"). Wording: tier 0 is \"below threshold\", never \"safe\"."
    },
    {
      "sceneId": "stack",
      "notes": "Keep this picture in mind for the rest of the deck. Data at the bottom, then the risk pipeline, the report files, the web server, and the dashboard on top. Each layer hands a finished result up. Every tier is decided in layer two and frozen in layer three. Claude sits beside the stack, reached only through the server, and only writes sentences.\n\n[about 29 s, from 0:55]\nBuilds bottom-up in data-flow order, then the freeze line, Claude with its dashed link to the server, tooling, and the dashboard thumbnail. Tooling: GitHub PRs, GitHub Actions CI (ruff + pytest, 71 tests), uv. Layers: README.md \"How it works\"; docs/CONTRACT.md."
    },
    {
      "sceneId": "data",
      "notes": "Layer one is the data, the organisers' CSVs. We train on 162,634 CDMs and test on 24,484 we never trained on. The loader keeps only the twelve allowed inputs plus the event id, the moment the file loads. The risk column is the true answer, so we only use it to score ourselves. On screen, the analyst sees the 2,167 test events.\n\n[about 29 s, from 1:24]\nThe stack shrinks into the rail: same picture, closer look. Train 162,634 / 13,154 events (docs/algorithm/algorithm.md §1.1). Test 24,484 / 2,167 (metrics.json; events.json). 12 inputs + event_id (triage/data.py FEATURES, EVENT); latitude and altitude are display only (DISPLAY_ONLY). True classes 15,756 / 6,501 / 2,227 (metrics.json class_counts). If asked \"the brief says 13 columns\": 12 inputs plus event_id, used for grouping only."
    },
    {
      "sceneId": "pipeline",
      "notes": "Layer two decides every tier. The NASA and ESA rules from the brief tier each CDM first. Then one model gets one narrow job: take away CDMs that are only Elevated because of the loose Pc bound and are really below threshold. Watch the dashboard: switch from the baseline rule to the model and the queue drops from 1,090 to 802. Critical is never touched.\n\n[about 30 s, from 1:53]\nRules: triage/tiers.py (Critical Pc ≥ 1e-4 or miss < 1 km; Elevated Pc ≥ 1e-6 or 1-5 km). Model: triage/model.py, gradient-boosted trees with monotonic constraints; demotion cut = 1% quantile of out-of-fold scores on truly Elevated candidates. False Elevated 4,526 → 2,206 (−51%), flagged 54.2% → 44.7% (metrics.json). Critical recall 100% comes from the rules, not the model. Both screenshots are real: the Baseline rule / Model toggle."
    },
    {
      "sceneId": "files",
      "notes": "Layer three is the hand-off. Four commands run once, before the demo, and write four files. During the demo nothing recalculates a tier, so the live system can't drift from what we evaluated. Look at event 482: the tier, the reasons and the caution in events.json are exactly what the detail panel shows. The files are the contract.\n\n[about 27 s, from 2:23]\ntrain → model.joblib, evaluate → metrics.json, build_events → events.json, predict → test_predictions.csv (README.md \"Run it\"). Frozen copies of events.json and metrics.json live in data/demo/ so teammates without the raw data see real numbers. Event 482 fields are verbatim from data/demo/events.json (first event). Contract: docs/CONTRACT.md."
    },
    {
      "sceneId": "live",
      "notes": "Layers four and five are live. A thin FastAPI server reads the report files and hands them to the browser; it has no code that changes a tier. The dashboard calls it: the ranked queue from slash api slash events, the selected event with its gauges and reasons, and the 3D Encounter view, which places both objects to scale.\n\n[about 27 s, from 2:50]\nRoutes from server.py: /api/summary, /api/events, /api/events/{id}, /api/metrics, /api/explain/{id}, /chat (GET page, POST copilot), /health, plus /config and /reset (which only clears a chat session). Reads reports/ first, falls back to data/demo/. 3D view: distances to scale, object icons enlarged (its own caption says so). Dashboard: plain JS modules, one per panel (static/js/)."
    },
    {
      "sceneId": "click",
      "notes": "Here's one click, end to end. The analyst clicks event 482. The browser asks the server for it, the server reads it from events.json, and the detail panel shows Critical, miss distance 601 metres, and a no-covariance caution. Only then, for the explanation, Claude rewords the same facts. With no key, the template writes it, and the tier is identical.\n\n[about 28 s, from 3:17]\nEVT 482: miss 601 m, Pc upper bound 10^-4.38, no_covariance (events.json first event; docs/demo-script.md). The capture had no API key, so the panel says \"Template summary of the fields above\"; with a key it says \"Written by Claude from the fields above\". Either way the response records claude or template as its source."
    },
    {
      "sceneId": "claude",
      "notes": "Claude is the voice, not the brain. It rewords fixed facts and powers the copilot through read-only tools, so every number it says traces back to a file. It never sets a tier, never invents a number, never recommends a manoeuvre. Here the copilot answered with no key: the fallback called list events, and every number came from that result.\n\n[about 28 s, from 3:45]\nGuardrail: any text containing \"safe\", \"safely\" or \"safety\" is thrown out and replaced by the template (triage/explain.py). Copilot eval (docs/eval_results.md, independent questions, fallback mode, 38 questions): round 2 after the fix round, 38/38 grounded, 38/38 avoid \"safe\", 38/38 no manoeuvre advice, 38/38 correct facts (round 1 was 35/38 grounded, 32/38 correct). Claude mode not yet evaluated (no credentials during the eval). The 188 in the capture is the fallback's count of Critical events with latest CDM within 3 days."
    },
    {
      "sceneId": "proof",
      "notes": "We didn't just build it, we tried to break it. Critical recall is 100 percent, because the rules guarantee it. One CDM is tiered too low: event 1278, 4.6 days out. Where we lose: the miss-distance rule has a better F1 but misses 91 Criticals. And our own gate said no twice, including to a model v2 that looked better.\n\n[about 28 s, from 4:13]\nCritical recall 100% (metrics.json model.critical_recall; by design). 1 under-tiered (confusion[1][0]); event 1278, row 14473, 4.62 d, miss 23,375 m, bound 10^-5.61, true 10^-5.92 (README.md \"Where it fails\"). Robustness 26/26, up from 20/26 (docs/robustness.md). Miss-distance rule F1 0.952 vs ours 0.910, misses 91 = 8 + 83 (metrics.json). First model flagged 100% of CDMs; v2: false alarms 2,214 → 1,694 (−23%) but 3 under-tiered vs limit 1, rejected (README.md). CI: ruff + 71 pytest tests on every PR."
    },
    {
      "sceneId": "progress",
      "notes": "Two pieces are in progress and not on main yet. The action queue sorts each event into maneuver planning, analyst review or monitor. It's rules only and can only raise attention. Kalent's forecast predicts the tier an event will end at. Today the next 24 hours panel is empty, because no test warning is within two days.\n\n[about 27 s, from 4:41]\nAction queue: draft code (triage/actions.py on a worktree branch), not merged; \"maneuver planning\" means start planning, never a decision. Forecast: design v1.1 in docs/algorithm/algorithm.md, no code or numbers on main; make no forecast claims. Minimum time to TCA in test = 2.0002 d; events_in_window 0 (events.json summary.warnings_24h). Persistence baseline catches 0 of 244 escalations on train events (algorithm.md §2.4), if asked. The placeholder frame is labelled as such: no recording exists."
    },
    {
      "sceneId": "usp",
      "notes": "Every team here will predict collision risk. Second Look is built so it can never hide a Critical. One: it removes noise, never danger. One in four flagged events goes, 1,090 to 802, and Critical recall is 100 percent by construction. Two: 135 of 196 Critical events are Critical on miss distance alone. Three: we rejected our own better model.\n\n[about 28 s, from 5:08]\nBeat 1 is an assurance argument, not an accuracy claim: the model may only remove Pc-only over-warnings, so Critical recall is 100% by construction (the rules, not the model). 288 removed events are all truly below threshold at their latest CDM. Beat 2: summary.critical_drivers miss_only 135, both 44, pc_only 17. NASA CA Handbook Rev 2: a miss-distance cutoff \"would result in a huge number of unnecessary mitigations\" (docs/algorithm/algorithm.md §2.2). We show which manoeuvres are Pc-backed; the analyst decides. Beat 3: v2 cut false alarms a further 23% but tiered 3 CDMs too low against our limit of 1 (v1 has 1), so it didn't ship. Receipts and honest eval are how we prove these claims."
    },
    {
      "sceneId": "close",
      "notes": "So, Second Look. Rules decide every tier. The model only trims false alarms. Claude only words the explanation. And the analyst always decides. Thank you, we'd love your questions.\n\n[about 13 s, from 5:36]\nRun it: uv sync, then uv run uvicorn server:app (serves the frozen data/demo reports). Interfaces: docs/CONTRACT.md. Method: docs/ALGO.md. Judge answers: docs/demo-script.md \"If a judge asks\"."
    }
  ]
}
    </script>
    </hyperframes-slideshow>
    <script>
      // Live presenting, for every player on the page (main view, presenter preview, audience tab).
      // The slideshow seeks straight to each slide's finished rest frame, so on each slide change the
      // composition is told to replay that slide's build in real time (__stackEnter: scan wipe, then
      // one idea at a time). Renders and checks never run this page.
      (function () {
        function players() {
          var out = [];
          (function walk(root) {
            root.querySelectorAll("*").forEach(function (el) {
              if (el.tagName === "HYPERFRAMES-PLAYER") out.push(el);
              if (el.shadowRoot) walk(el.shadowRoot);
            });
          })(document);
          return out;
        }
        var seen = new WeakMap();
        function tick() {
          players().forEach(function (pl) {
            var d, w;
            try {
              d = pl.iframeElement && pl.iframeElement.contentDocument;
              w = d && d.defaultView;
            } catch (e) { d = null; }
            if (!d || !w) return;
            var current = null;
            d.querySelectorAll(".scene").forEach(function (sc) {
              var cs = w.getComputedStyle(sc);
              if (cs.visibility !== "hidden" && cs.display !== "none") current = sc.getAttribute("data-composition-id");
            });
            if (current && seen.get(pl) !== current) {
              seen.set(pl, current);
              if (w.__stackEnter) w.__stackEnter(current);
            }
          });
        }
        setInterval(tick, 100);
      })();
    </script>
  </body>
