           identical to the island in composition/index.html. -->
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "cover",
      "notes": "This is Second Look, conjunction triage with bounded, inspectable demotion. It cuts the analyst's review queue by a quarter, shows a decision record for every downgrade, and it's architecturally forbidden from downgrading a rule-defined Critical. Behind me is our Horizon prediction replay: each dot is one CDM's predicted miss point, and the trace under it is real.\n\n[about 27 s, from 0:00]\nBackground: four real captures of /static/horizon.html, cross-faded: #demo=482&cdm=1 (1,426 m, Elevated), &cdm=3, &cdm=6 (601 m, inside 1 km, Critical), then #demo=805 (end state: decision, backend trace, illustrative manoeuvre). Each dot is one CDM's predicted miss point at closest approach (R/T/N, to scale). Orbits: real size, shape and tilt from the data; orientation around Earth is not in the data. The manoeuvre is illustrative: no manoeuvre data in the dataset, and Second Look never commands one. The trace comes from each event's certificate in events.json and the live GET /api/audit (11 checks PASS). Quarter = 1,090 → 802 events (README)."
    },
    {
      "sceneId": "problem",
      "notes": "Our user is the conjunction analyst who looks at every flagged warning. Today's rule flags a warning when its Pc upper bound or its miss distance crosses a threshold. The bound is deliberately loose, so the rule flags 54.2 percent of our test CDMs, and 4,534 of those are truly below threshold. That's 1,090 events in the queue.\n\n[about 27 s, from 0:27]\n54.2% of 24,484 test CDMs; 4,534 false alarms = truly below threshold, flagged at any tier (README \"The problem\", docs/EVAL.md). README also quotes \"false Elevated\" 4,526: the difference is 8 CDMs shown Critical by the Pc bound. 1,090 = baseline Elevated 894 + Critical 196 (events.json summary). Tier 0 is \"below threshold\", never \"safe\"."
    },
    {
      "sceneId": "usp",
      "notes": "So here's what Second Look does differently. One: it cuts the queue by a quarter, 1,090 to 802 events. Two: every one of the 288 downgrades carries a certificate, so you can inspect why. Three: every rule-defined Critical stays Critical, because the model is never allowed to act on one. That's the claim: bounded, inspectable demotion.\n\n[about 26 s, from 0:54]\nEvent level: all 288 removed events were truly below threshold at their latest update. Message level: 1 genuinely Elevated CDM was demoted (event 1278, scene 9). Critical recall 100% on test comes from the rules, not the model. Do NOT say \"never misses a collision\" or \"the only\". Certificate fields: rules_fired, candidate / why_not_candidate, model_score vs threshold, decision, four invariants, holds (docs/CONTRACT.md §6). 196 rule-defined Critical events = audit check critical_by_rule_stays_critical."
    },
    {
      "sceneId": "stack",
      "notes": "How it works, in five layers. Data at the bottom, then the risk pipeline, the report files, the web server, and the analyst views on top. Every tier is decided in layer two and frozen in layer three, with its certificate. Claude sits to the side and only writes explanations. It never sets a tier.\n\n[about 26 s, from 1:20]\nLayers: README \"How it works\"; docs/CONTRACT.md. Without an API key a template writes the explanation and the tier is identical. The copilot (/chat) still exists but is not featured in this deck. Views: dashboard (/), review page (/static/review.html, merged), decision point (/static/decision.html), horizon (/static/horizon.html)."
    },
    {
      "sceneId": "pipeline",
      "notes": "Layer two decides every tier. The NASA and ESA rules from the brief tier each message first. Then the model gets one narrow job: demote a warning that is Elevated only because of the loose Pc bound, and only when its inputs are usable and its score is under the threshold. Switch the dashboard to the model and the queue drops from 1,090 to 802. Critical is never touched.\n\n[about 32 s, from 1:46]\nRules: triage/tiers.py (Critical Pc ≥ 1e-4 or miss < 1 km; Elevated Pc ≥ 1e-6 or 1-5 km). Model: gradient-boosted trees with monotonic constraints (triage/model.py). Threshold = 1% quantile of out-of-fold scores on truly-Elevated candidates: a 99% recall target, measured out of fold, not a guarantee. Both screenshots are real: the Baseline rule / Model toggle."
    },
    {
      "sceneId": "task",
      "notes": "On 31 October the organisers sharpened the task: from the updates at least two days out, predict each event's final tier. The bar is keeping today's tier. Our bounded forecast lifts Critical recall from 0.865 to 0.911 on five-fold CV and catches 79 of 270 escalations, against none. The cost is honest: more false escalations, lower accuracy.\n\n[about 27 s, from 2:18]\ndocs/FORECAST.md, data/demo/forecast_metrics.json (shipped operating point: 90% final-Critical recall target, t_crit 0.585, t_elev 0.345; PR #74). 5-fold event CV, 11,942 cohort events, mean over folds: Critical recall 0.911 ± 0.050 vs 0.865 ± 0.042 for miss-only persistence (\"keep today's tier\"); Critical precision 0.757 vs 0.857; Critical F2 0.875 vs 0.863; escalations caught 79/270 vs 0/270; false escalations 775 vs 0; accuracy 0.888 vs 0.938 (lower; macro F1 0.834 vs 0.887). On accuracy, macro F1 and Critical precision we do NOT beat persistence. Honest line: a single distance rule (Critical if latest miss < ~1.1 km, m* tuned train-only to 90% recall, 1.04-1.14 km) does about as well on Critical: recall 0.897, F2 0.864, 47/270 caught (687 false escalations); the model's added value is mainly the extra escalations caught (79 vs 47). Organisers' 80/20 split (2,389 validation events): recall 0.910 vs 0.886, 13/50 escalations caught, 142 false escalations, accuracy 0.897 vs 0.943. Bounded: predicted = max(floor, model escalation); a rule-defined Critical at the latest ≥ 2 d update is never lowered. 616 of the 775 false escalations come from the floor (keeping Pc-only Elevated at Elevated). The 90% is a recall target measured out of fold, not a guarantee; it was chosen after seeing CV (the pre-registered target was 0.95). p_final is a class-weighted score, not a calibrated probability. Then the dashboard's default \"Final tier\" view (#67; \"Now\" restores per-message tiers): the escalated event card shows why the forecast lifts it (EVT 1565, Elevated floor → Critical, score 0.80 ≥ threshold 0.58); header 802 → 824 to review (rule floor → forecast, 81 escalated). Last frame: the dashboard's Evaluation tab, which now leads with the official panel (#68): the same 5-fold CV table (Second Look / keep today's tier / Pc-bound persistence, 80/20 on a toggle) and the 3x3 confusion matrix, read live from /api/metrics. Capture: /static/decision.html with real forecasts on the 2,167 test events (no outcomes, never scored): 255 Critical, 569 Elevated, 1,343 below threshold, 81 escalated. Expected queue: the forecast marks 255 of 2,167 test events Critical, against 196 by rule."
    },
    {
      "sceneId": "record",
      "notes": "Every downgrade opens to its decision record. Here's event 1071: Elevated by the Pc bound alone, eligible, a score of 0.00074 under the threshold of 0.0083, so it was demoted, and all invariants hold. Event 482 is a rule-defined Critical, so it isn't eligible and stays Critical. The record shows why. The analyst decides what to do.\n\n[about 27 s, from 2:45]\nReview page captured from main (/static/review.html, merged in #52); its top bar reads \"Guardrails PASS 11/11\". Event 1071: demoted Elevated → below threshold, debris, miss 6,388 m, 2.00 d. Event 482: payload, miss 601 m, placeholder sigma (no_covariance), queue MANEUVER PLANNING = start planning; whether to act is the operator's decision."
    },
    {
      "sceneId": "live",
      "notes": "And it proves it live. Every decision carries a certificate, and the Horizon trace reads it: rule fired, model not allowed, audit pass. GET slash api slash audit re-checks eleven invariants over all 2,167 events and 24,484 decisions. POST slash api slash triage tiers any CDM you send, with its certificate. Tamper with the file and the audit fails and names the check.\n\n[about 29 s, from 3:12]\nCapture: prediction replay flipbook (482 at CDM 1, 482 at CDM 6, 805 end state), then the push-in to event 805's backend trace: Pc 10^-3.96 ≥ 1e-4 and miss 900 m < 1 km; model allowed? No: rule-defined Critical; decision not eligible → Maneuver Planning; audit PASS (11 checks). The manoeuvre on 805 is illustrative. GET /api/audit on main: status PASS, 11/11 checks (frozen copy in assets/ui/audit.json). Counts: 2,167 events, 24,484 CDM decisions, 153 kept, 288 demoted, 1,726 not eligible. All 288 demotions have score < threshold (the audit checks the stored score; it does not re-derive it). POST /api/triage without a model artifact runs \"rules only\"; the deck example is a sample CDM (data/sample) tiered Elevated with all four invariants true. Tamper test: docs/CONTRACT.md §6."
    },
    {
      "sceneId": "eval",
      "notes": "Now the honest part. The strongest simple baseline, the miss rule plus the Pc bound for Critical only, beats us on false alarms: 8 against our 2,214. The price is 1,012 truly Elevated messages shown as below threshold; we show one. Our value is the Pc-Elevated band. And on train cross-validation, the model removes 64.1 percent of false alarms, against 9.7 for a tuned Pc threshold.\n\n[about 31 s, from 3:41]\ndocs/EVAL.md and README \"Results\". Test table: status quo 100% / 4,534 / 0 under-tiered; miss-distance rule 95.9% (misses 91 Critical CDMs) / 0 / 1,116 (best macro F1 0.952, flattering by construction); miss rule + Pc for Critical only 100% / 8 / 1,012 (workload 31.5% vs our 44.7%); ours 100% / 2,214 / 1. The two untuned rules are fixed from the brief, so scoring them on test is a baseline, not tuning. CV (train only, nested, event-grouped 5-fold, same 99% rule): tuned Pc threshold 9.7% removed, 47 under-tiered; model 64.1%, 39 under-tiered."
    },
    {
      "sceneId": "next",
      "notes": "Here's the forecast in full. On five-fold CV, 760 of 834 final-Critical events are forecast Critical, and most errors over-warn rather than under-warn. We ship the 90 percent target: 95 percent would catch 115 escalations, not 79, but with 1,139 false escalations instead of 775. And honestly, a single distance rule does about as well on Critical. Still open: calibrated scores, a live feed, and data inside two days.\n\n[about 32 s, from 4:12]\nConfusion matrix: 5-fold CV, summed over folds (as on the Evaluation tab), rows = true final tier, columns = forecast (below / Elevated / Critical): below 8,019 / 900 / 27; Elevated 119 / 1,824 / 219; Critical 10 / 64 / 760. Under-tiered: 193 events (119 + 10 + 64); over-tiered: 1,146. Persistence (miss-only) for comparison: Critical 14 / 99 / 721. Recall-target sweep (docs/FORECAST.md, re-tuned train-only per target): 0.85 → recall 0.873, precision 0.808, F2 0.859, 47/270 caught, 703 false escalations, accuracy 0.891; 0.90 (shipped) → recall 0.911, precision 0.757, F2 0.875, 79/270, 775, accuracy 0.888; 0.95 (sensitivity) → recall 0.950, precision 0.565, F2 0.835, 115/270, 1,139, accuracy 0.862. 0.95 was the pre-registered target; the team chose 0.90 after seeing CV (PR #74: best Critical F2 of the three, 364 fewer false escalations), so the CV numbers at 0.90 are slightly optimistic. Distance rule (nowcast floor + Critical if latest miss < m*, m* tuned train-only to 90% recall, 1.04-1.14 km): recall 0.897, precision 0.755, F2 0.864, 47/270 caught, 687 false escalations. No test CDM is closer than 2 days (minimum 2.0002 d), so the final window is untested. Claude-mode explanations are not evaluated (copilot eval was fallback mode)."
    },
    {
      "sceneId": "close",
      "notes": "So, Second Look. Rules decide every tier. The model only removes over-warnings, and every removal is on the record. Claude only writes explanations. And the analyst always decides. It preserves every rule-defined Critical. Thank you, we'd love your questions.\n\n[about 18 s, from 4:44]\nRun it: uv sync, then uv run uvicorn server:app (serves the frozen data/demo reports); GET /api/audit for the live check. Interfaces: docs/CONTRACT.md. Method: docs/ALGO.md. Evaluation: docs/EVAL.md and docs/FORECAST.md. Background: Horizon view pulled back to the globe (#view=globe; orbits real size, shape and tilt, orientation not in the data)."
    }
  ]
}
    </script>

    <script>
      // Live presenting, for every player on the page (main view, presenter preview, audience tab).
      // The slideshow seeks straight to each slide's finished rest frame, so each composition is armed
      // (__stackArm) to watch its own slide changes and, in the same frame, fade the new slide up and replay
      // its build in real time (__stackEnter). The poll below arms new players and is a fallback.
      // Renders and checks never run this page.
      (function () {
        function players() {
          var out = [];
          (function walk(root) {
            root.querySelectorAll("*").forEach(function (el) {
              if (el.tagName === "HYPERFRAMES-PLAYER") out.push(el);
              if (el.shadowRoot) walk(el.shadowRoot);
            });
          })(document);
          return out;
        }
        var seen = new WeakMap();
        function tick() {
          players().forEach(function (pl) {
            var d, w;
            try {
              d = pl.iframeElement && pl.iframeElement.contentDocument;
              w = d && d.defaultView;
            } catch (e) { d = null; }
            if (!d || !w) return;
            if (w.__stackArm && !w.__stackArmed) w.__stackArm();
            var current = null;
            d.querySelectorAll(".scene").forEach(function (sc) {
              var cs = w.getComputedStyle(sc);
              if (cs.visibility !== "hidden" && cs.display !== "none") current = sc.getAttribute("data-composition-id");
            });
            if (current && seen.get(pl) !== current) {
              seen.set(pl, current);
              if (w.__stackEnter) w.__stackEnter(current);
            }
          });
        }
        setInterval(tick, 100);
      })();
    </script>
